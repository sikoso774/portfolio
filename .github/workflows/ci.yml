name: CI — Build Check

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  build-check:
    name: Verify build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Même version que le déploiement (withastro/action : Node 24 par défaut)
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Les tests passent en premier : ils échouent vite et couvrent le SEO,
      # l'i18n, les composants et le Worker (le test SEO construit aussi le site).
      - name: Run tests
        run: npm test

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build
